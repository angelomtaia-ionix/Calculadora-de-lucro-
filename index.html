<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Calculadora de Lucro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc. Lucro">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F2ECDE;
    --ink:#1E2A38;
    --zinc-1:#B9BEC2;
    --zinc-2:#9BA1A6;
    --zinc-3:#8B9096;
    --ochre:#D6A11C;
    --brick:#B4432D;
    --teal:#2E6F5E;
    --line:#D8CFB8;
    --card:#FBF8F1;
    --danger:#B4432D;
    --good:#2E6F5E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .signboard{
    position:relative;
    background:
      repeating-linear-gradient(180deg,
        var(--zinc-1) 0px, var(--zinc-1) 3px,
        var(--zinc-2) 3px, var(--zinc-2) 6px,
        var(--zinc-3) 6px, var(--zinc-3) 9px);
    padding:28px 20px 22px;
    border-bottom:6px solid var(--ink);
    box-shadow: inset 0 -12px 18px -12px rgba(0,0,0,0.35);
  }
  .signboard::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(0,0,0,0.12), transparent 15%, transparent 85%, rgba(0,0,0,0.12));
    pointer-events:none;
  }
  .signboard h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(26px,7vw,36px);
    color:var(--brick);
    -webkit-text-stroke:1.5px #4a1c10;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15), 0 0 1px #4a1c10;
    margin:0;
    letter-spacing:0.5px;
    transform: rotate(-0.6deg);
  }
  .signboard p{
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--ink);
    background:var(--ochre);
    display:inline-block;
    padding:3px 10px;
    margin:8px 0 0;
    font-size:14px;
    border-radius:2px;
    transform: rotate(0.4deg);
  }

  nav{
    display:flex;
    background:var(--ink);
    overflow-x:auto;
  }
  nav button{
    flex:1;
    min-width:84px;
    background:none;
    border:none;
    color:#B9C2CC;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:13px 6px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav button.active{
    color:#fff;
    border-bottom:3px solid var(--ochre);
    background:rgba(255,255,255,0.05);
  }

  main{ padding:16px; max-width:640px; margin:0 auto 60px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--ink);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat{
    background:var(--ink);
    color:#fff;
    border-radius:8px;
    padding:14px 12px;
  }
  .stat .label{ font-size:11px; opacity:0.7; text-transform:uppercase; letter-spacing:0.5px;}
  .stat .value{ font-family:'Fraunces',serif; font-size:21px; font-weight:700; margin-top:4px;}
  .stat.lucro .value{ color:var(--ochre); }
  .stat.gasto .value{ color:#E8A6A6; }
  .stat.vendas .value{ color:#9FD8C8; }

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin:10px 0 4px;
  }
  input, select{
    width:100%;
    padding:10px 11px;
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:#fff;
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--ochre);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  button.primary{
    width:100%;
    margin-top:14px;
    padding:12px;
    background:var(--brick);
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  button.primary:active{ opacity:0.85; }
  button.secondary{
    background:none;
    border:1.5px solid var(--line);
    color:var(--ink);
    padding:8px 12px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }

  .preview{
    margin-top:10px;
    padding:10px 12px;
    background:#FFF9EA;
    border:1px dashed var(--ochre);
    border-radius:6px;
    font-size:13px;
  }
  .preview b{ color:var(--brick); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--zinc-3);
    border-bottom:1.5px solid var(--line);
    padding:6px 4px;
  }
  td{ padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{ border-bottom:none; }
  .tag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:20px;
    text-transform:uppercase;
  }
  .tag.entrada{ background:#E3EFEB; color:var(--teal); }
  .tag.venda{ background:#FCEAE0; color:var(--brick); }
  .tag.gasto{ background:#EFE6D2; color:#8A6A12; }
  .lucro-pos{ color:var(--good); font-weight:700; }
  .lucro-neg{ color:var(--danger); font-weight:700; }
  .empty{ text-align:center; color:var(--zinc-3); padding:24px 8px; font-size:13px;}
  .del{
    background:none;border:none;color:var(--zinc-3);cursor:pointer;font-size:16px;padding:2px 6px;
  }
  .stock-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .stock-row:last-child{ border-bottom:none; }
  .stock-name{ font-weight:600; font-size:13.5px; }
  .stock-qty{ font-size:12px; color:var(--zinc-3); }
  .low{ color:var(--brick); font-weight:700; }
  .foot-note{ font-size:11px; color:var(--zinc-3); text-align:center; margin-top:18px; padding:0 20px; line-height:1.5;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:600; opacity:0; transition:opacity 0.25s;
    pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="signboard">
  <h1>Calculadora de Lucro</h1>
  <p>J&amp;T Business</p>
</div>

<div id="sync-bar" style="background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
  <span id="sync-status">🔴 Não sincronizado — só neste telemóvel</span>
  <button id="sync-btn" onclick="signIn()" style="background:var(--teal);color:#fff;border:none;border-radius:5px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;">Entrar com Google</button>
</div>

<nav id="tabs">
  <button data-tab="resumo" class="active" data-admin-only="1">Resumo</button>
  <button data-tab="gasto" data-admin-only="1">Gastos&nbsp;iniciais</button>
  <button data-tab="entrada" data-admin-only="1">Entrada</button>
  <button data-tab="venda">Venda</button>
  <button data-tab="stock" data-admin-only="1">Stock</button>
  <button data-tab="cargas" data-admin-only="1">Cargas</button>
  <button data-tab="historico" data-admin-only="1">Histórico</button>
  <button data-tab="ajuda" data-admin-only="1">Ajuda</button>
</nav>

<div id="role-bar" style="display:none;background:#1E2A38;color:#D6A11C;font-size:11.5px;padding:5px 16px;text-align:center;"></div>

<main id="app">Carregando…</main>
<div style="background:#FFF9EA;padding:8px 16px;font-size:11px;color:#8A6A12;text-align:center;">
  🔒 Cada conta Google vê só os seus próprios dados — nada é partilhado com outros utilizadores.
</div>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function(e){
  var app = document.getElementById('app');
  if(app){
    app.innerHTML = '<div class="card"><h2 style="color:#B4432D">Ocorreu um erro</h2>' +
      '<p style="font-size:13px">' + (e.message || 'Erro desconhecido') + '</p>' +
      '<p style="font-size:12px;color:#8B9096">Tira um print deste ecrã e envia para ajuda a corrigir.</p></div>';
  }
});
const STORE_KEY = 'ribaue-banca-v1';
let state = { gastos: [], entradas: [], vendas: [], updatedAt: 0 };
let currentTab = 'resumo';

// ---- Papel do dispositivo (Administrador / Vendedor) ----
function obterPapel(){
  try{ return localStorage.getItem('calculadora-lucro-papel') || 'admin'; }catch(e){ return 'admin'; }
}
function definirPapel(papel){
  try{ localStorage.setItem('calculadora-lucro-papel', papel); }catch(e){}
}
function obterPin(){
  // prioriza o PIN guardado nos dados sincronizados (sobrevive a limpar o telemóvel)
  if(state && state.adminPin) return state.adminPin;
  try{ return localStorage.getItem('calculadora-lucro-pin') || ''; }catch(e){ return ''; }
}
function definirPin(pin){
  state.adminPin = pin;
  saveState(); // grava localmente e envia para o Drive, se sincronizado
  try{ localStorage.setItem('calculadora-lucro-pin', pin); }catch(e){}
}

function activarModoVendedor(){
  let pin = obterPin();
  if(!pin){
    const novoPin = prompt('Ainda não definiste um PIN de administrador.\nCria um PIN (4 dígitos) para poderes voltar a este modo depois:');
    if(!novoPin || novoPin.trim().length < 4){ showToast('PIN inválido — precisa de pelo menos 4 dígitos'); return; }
    definirPin(novoPin.trim());
  }
  definirPapel('vendas');
  currentTab = 'venda';
  aplicarPermissoes();
  render();
  showToast('Modo Vendedor activado neste telemóvel');
}

function voltarModoAdmin(){
  const pin = obterPin();
  const tentativa = prompt('Introduz o PIN de administrador para voltar ao modo completo:');
  if(tentativa === null) return;
  if(tentativa.trim() !== pin){ showToast('PIN incorrecto'); return; }
  definirPapel('admin');
  aplicarPermissoes();
  render();
  showToast('Modo Administrador restaurado');
}

function aplicarPermissoes(){
  const papel = obterPapel();
  const bar = document.getElementById('role-bar');
  document.querySelectorAll('#tabs button[data-admin-only]').forEach(btn=>{
    btn.style.display = (papel === 'vendas') ? 'none' : '';
  });
  if(papel === 'vendas'){
    if(currentTab !== 'venda') currentTab = 'venda';
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
    const vBtn = document.querySelector('#tabs button[data-tab="venda"]');
    if(vBtn) vBtn.classList.add('active');
    if(bar){
      bar.style.display = 'flex';
      bar.style.justifyContent = 'space-between';
      bar.style.alignItems = 'center';
      bar.innerHTML = '<span>👤 Modo Vendedor — só podes registar vendas</span>' +
        '<button onclick="voltarModoAdmin()" style="background:none;border:1px solid #D6A11C;color:#D6A11C;border-radius:4px;padding:3px 8px;font-size:10.5px;cursor:pointer;">Sair deste modo</button>';
    }
  } else {
    if(bar){
      bar.style.display = 'flex';
      bar.style.justifyContent = 'space-between';
      bar.style.alignItems = 'center';
      bar.innerHTML = '<span>🛠 Modo Administrador — acesso completo</span>' +
        '<button onclick="activarModoVendedor()" style="background:none;border:1px solid #D6A11C;color:#D6A11C;border-radius:4px;padding:3px 8px;font-size:10.5px;cursor:pointer;">Activar Modo Vendedor</button>';
    }
  }
}
let loaded = false;

// ---- Sincronização com Google Drive ----
const GOOGLE_CLIENT_ID = '519082885918-iblstrjm2cqrur3j2ac38vqo2svgdb3m.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const DRIVE_FILENAME = 'calculadora-lucro-dados.json';
let tokenClient = null;
let accessToken = null;
let driveFileId = null;
let userEmail = null;
let syncTimer = null;

let googleInitTentativas = 0;
function initGoogleAuth(){
  const status = document.getElementById('sync-status');
  if(typeof google === 'undefined' || !google.accounts){
    googleInitTentativas++;
    if(status) status.textContent = '⚪ A preparar login do Google...';
    if(googleInitTentativas > 20){
      if(status) status.textContent = '🔴 Não foi possível carregar o sistema de login do Google (verifica a internet e recarrega a página)';
      return;
    }
    setTimeout(initGoogleAuth, 500);
    return;
  }
  try{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: onTokenResponse
    });
    if(restaurarSessao()){
      // já tínhamos sessão nesta mesma utilização da app — confirma que o token ainda é válido
      // (usa a própria API do Drive para validar, já que é isso que o âmbito de acesso permite)
      if(status) status.textContent = '🟡 A restaurar sessão...';
      fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?fields=id`, {
        headers: { Authorization: 'Bearer ' + accessToken }
      }).then(r=>{
        if(!r.ok) throw new Error('token expirado');
        return r.json();
      }).then(()=>{
        iniciarSincronizacaoPeriodica();
        pullFromDrive(true);
        atualizarBarraSync();
      }).catch(()=>{
        accessToken = null; driveFileId = null; userEmail = null;
        limparSessao();
        atualizarBarraSync();
      });
    } else {
      if(status) status.textContent = '🔴 Não sincronizado — só neste telemóvel';
    }
  }catch(e){
    if(status) status.textContent = '🔴 Erro a preparar login: ' + e.message;
  }
}

function signIn(){
  const status = document.getElementById('sync-status');
  if(!tokenClient){
    if(status) status.textContent = '🟡 Sistema de login ainda não está pronto, aguarda...';
    return;
  }
  if(status) status.textContent = '🟡 A abrir login do Google...';
  tokenClient.requestAccessToken();
}

function guardarSessao(){
  try{
    localStorage.setItem('gdrive-sessao', JSON.stringify({
      accessToken, driveFileId, userEmail
    }));
  }catch(e){}
}

function limparSessao(){
  try{ localStorage.removeItem('gdrive-sessao'); }catch(e){}
}

function restaurarSessao(){
  try{
    const raw = localStorage.getItem('gdrive-sessao');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.accessToken || !s.driveFileId) return false;
    accessToken = s.accessToken;
    driveFileId = s.driveFileId;
    userEmail = s.userEmail;
    return true;
  }catch(e){ return false; }
}

function signOut(){
  if(accessToken){
    google.accounts.oauth2.revoke(accessToken, ()=>{});
  }
  accessToken = null;
  driveFileId = null;
  userEmail = null;
  limparSessao();
  if(syncTimer){ clearInterval(syncTimer); syncTimer = null; }
  // limpa os dados do ecrã e do telemóvel — ficam só guardados no Drive da conta
  state = { gastos: [], entradas: [], vendas: [], updatedAt: 0 };
  try{ localStorage.removeItem('calculadora-lucro-estado'); }catch(e){}
  atualizarBarraSync();
  render();
  showToast('Sessão terminada — dados removidos deste telemóvel');
}

function onTokenResponse(response){
  if(response.error){
    document.getElementById('sync-status').textContent = '🔴 Erro no login: ' + response.error;
    return;
  }
  accessToken = response.access_token;
  document.getElementById('sync-status').textContent = '🟡 A ligar ao Drive...';
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + accessToken }
  }).then(r=>r.json()).then(info=>{
    userEmail = info.email || 'conta Google';
    guardarSessao();
    ensureDriveFile();
  }).catch(()=>{
    guardarSessao();
    ensureDriveFile();
  });
}

function ensureDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + accessToken }
  })
  .then(r=>{
    if(!r.ok){
      return r.json().then(err=>{ throw new Error('Drive list ' + r.status + ': ' + JSON.stringify(err.error && err.error.message || err)); });
    }
    return r.json();
  })
  .then(data=>{
    if(data.files && data.files.length > 0){
      driveFileId = data.files[0].id;
      guardarSessao();
      pullFromDrive(true);
    } else {
      criarFicheiroDrive();
    }
  })
  .catch((e)=>{
    document.getElementById('sync-status').textContent = '🔴 Erro Drive: ' + (e.message || e);
  });
}

function criarFicheiroDrive(){
  const metadata = { name: DRIVE_FILENAME, mimeType: 'application/json' };
  const boundary = '-------calc-lucro-boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(state)}\r\n` +
    `--${boundary}--`;
  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body: body
  })
  .then(r=>{
    if(!r.ok){
      return r.json().then(err=>{ throw new Error('Criar ficheiro ' + r.status + ': ' + JSON.stringify(err.error && err.error.message || err)); });
    }
    return r.json();
  })
  .then(data=>{
    driveFileId = data.id;
    guardarSessao();
    iniciarSincronizacaoPeriodica();
    atualizarBarraSync();
    showToast('Ligado ao Google Drive');
  })
  .catch((e)=>{
    document.getElementById('sync-status').textContent = '🔴 Erro Drive: ' + (e.message || e);
  });
}

function pullFromDrive(silencioso){
  if(!accessToken || !driveFileId) return;
  fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + accessToken }
  })
  .then(r=>r.json())
  .then(remoto=>{
    if(remoto && typeof remoto.updatedAt === 'number' && remoto.updatedAt > (state.updatedAt||0)){
      state = remoto;
      try{ localStorage.setItem('calculadora-lucro-estado', JSON.stringify(state)); }catch(e){}
      render();
      if(!silencioso) showToast('Dados actualizados a partir do Drive');
    }
    iniciarSincronizacaoPeriodica();
    atualizarBarraSync();
  })
  .catch(()=>{
    iniciarSincronizacaoPeriodica();
    atualizarBarraSync();
  });
}

function pushToDrive(){
  if(!accessToken || !driveFileId) return;
  fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
    method: 'PATCH',
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(state)
  }).catch(()=>{ showToast('Não foi possível sincronizar agora'); });
}

function iniciarSincronizacaoPeriodica(){
  if(syncTimer) return;
  syncTimer = setInterval(()=>pullFromDrive(true), 15000);
}

function atualizarBarraSync(){
  const status = document.getElementById('sync-status');
  const btn = document.getElementById('sync-btn');
  if(!status || !btn) return;
  if(accessToken && driveFileId){
    status.textContent = `🟢 Sincronizado${userEmail ? ' — ' + userEmail : ''}`;
    btn.textContent = 'Sair';
    btn.onclick = signOut;
  } else {
    status.textContent = '🔴 Não sincronizado — só neste telemóvel';
    btn.textContent = 'Entrar com Google';
    btn.onclick = signIn;
  }
}

function esc(texto){
  if(texto === null || texto === undefined) return '';
  return String(texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtMT(n){
  return (Math.round(n*100)/100).toLocaleString('pt-PT') + ' MT';
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(s){
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function loadState(){
  try{
    let raw = localStorage.getItem('calculadora-lucro-estado');
    if(!raw){
      // migração: procura dados guardados com o nome antigo da app
      const antigo = localStorage.getItem('mtaia-estado');
      if(antigo){
        raw = antigo;
        localStorage.setItem('calculadora-lucro-estado', antigo);
      }
    }
    if(raw){
      state = JSON.parse(raw);
      if(typeof state.updatedAt !== 'number') state.updatedAt = 0;
    }
  }catch(e){
    // no data yet
  }
  loaded = true;
  render();
  initGoogleAuth();
}

function saveState(){
  state.updatedAt = Date.now();
  try{
    localStorage.setItem('calculadora-lucro-estado', JSON.stringify(state));
  }catch(e){
    showToast('Erro ao guardar — tenta novamente');
  }
  if(accessToken && driveFileId){
    pushToDrive();
  }
}

function exportarDados(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calculadora-lucro-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Ficheiro de backup transferido');
}

function importarDados(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const novo = JSON.parse(e.target.result);
      if(!novo.gastos || !novo.entradas || !novo.vendas) throw new Error('formato inválido');
      state = novo;
      saveState();
      showToast('Dados importados com sucesso');
      render();
    }catch(err){
      showToast('Ficheiro inválido — não foi possível importar');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ---- Stock derivation from entradas + vendas ----
function computeStock(){
  const stock = {}; // nome -> {qty, custoMedio, totalInvestido}
  state.entradas.forEach(e=>{
    if(!stock[e.produto]) stock[e.produto] = {qty:0, valor:0};
    stock[e.produto].qty += e.qtd;
    stock[e.produto].valor += e.qtd * e.custoUnit;
  });
  state.vendas.forEach(v=>{
    if(!stock[v.produto]) stock[v.produto] = {qty:0, valor:0};
    const custoMedioAntes = stock[v.produto].qty > 0 ? (stock[v.produto].valor/stock[v.produto].qty) : v.custoUnit;
    stock[v.produto].qty -= v.qtd;
    stock[v.produto].valor -= v.qtd * custoMedioAntes;
  });
  return stock;
}

function custoMedioAtual(produto){
  const stock = computeStock();
  const s = stock[produto];
  if(!s || s.qty <= 0) return null;
  return s.valor / s.qty;
}

// ---- Totals ----
function totals(){
  const totalGastos = state.gastos.reduce((a,g)=>a+g.valor,0);
  const totalEntradas = state.entradas.reduce((a,e)=>a+e.qtd*e.custoUnit,0);
  const totalVendas = state.vendas.reduce((a,v)=>a+v.qtd*v.precoUnit,0);
  const totalLucro = state.vendas.reduce((a,v)=>a+v.lucro,0);
  const investidoTotal = totalGastos + totalEntradas;
  return {totalGastos, totalEntradas, totalVendas, totalLucro, investidoTotal};
}

function produtosMaisVendidos(){
  const agrupado = {};
  state.vendas.forEach(v=>{
    if(!agrupado[v.produto]) agrupado[v.produto] = {qtd:0, receita:0, lucro:0};
    agrupado[v.produto].qtd += v.qtd;
    agrupado[v.produto].receita += v.qtd * v.precoUnit;
    agrupado[v.produto].lucro += v.lucro;
  });
  return Object.entries(agrupado)
    .map(([produto, dados])=>({produto, ...dados}))
    .sort((a,b)=> b.qtd - a.qtd);
}

// Calcula quanto de cada entrada (lote) já foi vendido, seguindo a ordem
// "primeiro a entrar, primeiro a sair" (FIFO), e atribui receita/lucro reais a cada lote.
function calcularLotes(){
  const lotes = state.entradas.map(e => ({
    ...e, qtdVendida: 0, receita: 0, lucro: 0, restante: e.qtd
  }));
  const porProduto = {};
  lotes.forEach(l=>{
    if(!porProduto[l.produto]) porProduto[l.produto] = [];
    porProduto[l.produto].push(l);
  });
  Object.values(porProduto).forEach(arr => arr.sort((a,b)=>a.id-b.id));

  const vendasOrdenadas = [...state.vendas].sort((a,b)=>a.id-b.id);
  vendasOrdenadas.forEach(v=>{
    let restante = v.qtd;
    const arr = porProduto[v.produto] || [];
    for(const lote of arr){
      if(restante <= 0) break;
      if(lote.restante <= 0) continue;
      const consumido = Math.min(lote.restante, restante);
      lote.restante -= consumido;
      restante -= consumido;
      lote.qtdVendida += consumido;
      lote.receita += consumido * v.precoUnit;
      lote.lucro += consumido * (v.precoUnit - lote.custoUnit);
    }
  });
  return lotes;
}

function calcularCargas(){
  const lotes = calcularLotes();
  const agrupado = {};
  lotes.forEach(l=>{
    const nome = l.carga && l.carga.trim() ? l.carga.trim() : 'Sem carga definida';
    if(!agrupado[nome]) agrupado[nome] = { investido:0, qtdTotal:0, qtdVendida:0, qtdRestante:0, receita:0, lucro:0, dataMaisRecente:l.data, produtos:[] };
    const g = agrupado[nome];
    g.investido += l.qtd * l.custoUnit;
    g.qtdTotal += l.qtd;
    g.qtdVendida += l.qtdVendida;
    g.qtdRestante += l.restante;
    g.receita += l.receita;
    g.lucro += l.lucro;
    g.produtos.push(l);
    if(l.data > g.dataMaisRecente) g.dataMaisRecente = l.data;
  });
  Object.values(agrupado).forEach(g=>{
    g.produtos.sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
  });
  return Object.entries(agrupado)
    .map(([carga, dados])=>({carga, ...dados}))
    .sort((a,b)=> b.dataMaisRecente.localeCompare(a.dataMaisRecente));
}

// ---- Histórico de vendas e lucro por período ----
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let historicoPeriodo = 'dia';

function parseDataLocal(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatarDataCurta(d){
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function chaveSemana(dataStr){
  const d = parseDataLocal(dataStr);
  const diaSemana = d.getDay(); // 0 = domingo
  const diff = (diaSemana === 0 ? -6 : 1 - diaSemana); // segunda-feira como início da semana
  const segunda = new Date(d);
  segunda.setDate(d.getDate() + diff);
  return segunda.getFullYear() + '-' + String(segunda.getMonth()+1).padStart(2,'0') + '-' + String(segunda.getDate()).padStart(2,'0');
}

function agruparVendasPorPeriodo(tipo){
  const grupos = {};
  state.vendas.forEach(v=>{
    const d = parseDataLocal(v.data);
    let chave, label;
    if(tipo === 'dia'){
      chave = v.data;
      label = fmtDate(v.data);
    } else if(tipo === 'semana'){
      chave = chaveSemana(v.data);
      const inicio = parseDataLocal(chave);
      const fim = new Date(inicio); fim.setDate(inicio.getDate()+6);
      label = 'Semana de ' + formatarDataCurta(inicio) + ' a ' + formatarDataCurta(fim);
    } else if(tipo === 'mes'){
      chave = v.data.slice(0,7);
      label = MESES_PT[d.getMonth()] + ' de ' + d.getFullYear();
    } else {
      chave = String(d.getFullYear());
      label = String(d.getFullYear());
    }
    if(!grupos[chave]) grupos[chave] = { chave, label, qtd:0, receita:0, lucro:0, vendas:[] };
    grupos[chave].qtd += v.qtd;
    grupos[chave].receita += v.qtd * v.precoUnit;
    grupos[chave].lucro += v.lucro;
    grupos[chave].vendas.push(v);
  });
  Object.values(grupos).forEach(g=>{
    g.vendas.sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
  });
  return Object.values(grupos).sort((a,b)=> b.chave.localeCompare(a.chave));
}

// ---- Entradas agrupadas por período (mesma lógica das vendas) ----
let entradaPeriodo = 'dia';

function chaveELabelPeriodo(dataStr, tipo){
  const d = parseDataLocal(dataStr);
  if(tipo === 'dia'){
    return { chave: dataStr, label: fmtDate(dataStr) };
  } else if(tipo === 'semana'){
    const chave = chaveSemana(dataStr);
    const inicio = parseDataLocal(chave);
    const fim = new Date(inicio); fim.setDate(inicio.getDate()+6);
    return { chave, label: 'Semana de ' + formatarDataCurta(inicio) + ' a ' + formatarDataCurta(fim) };
  } else if(tipo === 'mes'){
    return { chave: dataStr.slice(0,7), label: MESES_PT[d.getMonth()] + ' de ' + d.getFullYear() };
  }
  return { chave: String(d.getFullYear()), label: String(d.getFullYear()) };
}

function agruparEntradasPorPeriodo(tipo){
  const grupos = {};
  state.entradas.forEach(e=>{
    const { chave, label } = chaveELabelPeriodo(e.data, tipo);
    if(!grupos[chave]) grupos[chave] = { chave, label, qtd:0, investido:0, entradas:[] };
    grupos[chave].qtd += e.qtd;
    grupos[chave].investido += e.qtd * e.custoUnit;
    grupos[chave].entradas.push(e);
  });
  Object.values(grupos).forEach(g=>{
    g.entradas.sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
  });
  return Object.values(grupos).sort((a,b)=> b.chave.localeCompare(a.chave));
}

function mudarEntradaPeriodo(tipo){
  entradaPeriodo = tipo;
  render();
}

function mudarHistoricoPeriodo(tipo){
  historicoPeriodo = tipo;
  render();
}

function render(){
  if(!loaded) return;
  const app = document.getElementById('app');
  if(currentTab==='resumo') app.innerHTML = renderResumo();
  else if(currentTab==='gasto') app.innerHTML = renderGasto();
  else if(currentTab==='entrada') app.innerHTML = renderEntrada();
  else if(currentTab==='venda') app.innerHTML = renderVenda();
  else if(currentTab==='stock') app.innerHTML = renderStock();
  else if(currentTab==='cargas') app.innerHTML = renderCargas();
  else if(currentTab==='historico') app.innerHTML = renderHistorico();
  else if(currentTab==='ajuda') app.innerHTML = renderAjuda();
  attachHandlers();
}

function renderStock(){

    nomes.map(n=>{
      const s = stock[n];
      const custoMedio = s.qty>0 ? s.valor/s.qty : 0;
      return `<div class="stock-row">
        <div>

// ---- Handlers ----
function attachHandlers(){
  const eProduto = document.getElementById('e-produto');
  const eQtd = document.getElementById('e-qtd');
  const eCusto = document.getElementById('e-custo');
  if(eQtd && eCusto){
    [eQtd, eCusto].forEach(el=>el.addEventListener('input', updateEntradaPreview));
  }
  const vProduto = document.getElementById('v-produto');
  const vQtd = document.getElementById('v-qtd');
  const vPreco = document.getElementById('v-preco');
  if(vProduto && vQtd && vPreco){
    [vProduto, vQtd, vPreco].forEach(el=>el.addEventListener('input', updateVendaPreview));
  }
}

function updateEntradaPreview(){
  const qtd = parseFloat(document.getElementById('e-qtd').value)||0;
  const custo = parseFloat(document.getElementById('e-custo').value)||0;
  document.getElementById('e-preview').innerHTML = `Custo total desta entrada: <b>${fmtMT(qtd*custo)}</b>`;
}

function updateVendaPreview(){
  const produto = document.getElementById('v-produto').value.trim();
  const qtd = parseFloat(document.getElementById('v-qtd').value)||0;
  const preco = parseFloat(document.getElementById('v-preco').value)||0;
  const el = document.getElementById('v-preview');
  if(!produto || qtd<=0){
    el.innerHTML = 'Escolhe o produto e a quantidade para ver o lucro calculado automaticamente.';
    return;
  }
  const custoMedio = custoMedioAtual(produto);
  if(custoMedio===null){
    el.innerHTML = `<b>Aviso:</b> não há stock registado para "${esc(produto)}". O lucro vai assumir custo 0 — regista primeiro a entrada deste produto para um cálculo correcto.`;
    return;
  }
  const lucro = qtd*(preco-custoMedio);
  el.innerHTML = `Custo médio: <b>${fmtMT(custoMedio)}</b>/un &nbsp;→&nbsp; Lucro desta venda: <b class="${lucro>=0?'lucro-pos':'lucro-neg'}">${lucro>=0?'+':''}${fmtMT(lucro)}</b>`;
}

function ultimoNome(){
  try{
    return localStorage.getItem('calculadora-lucro-ultimo-nome') || '';
  }catch(e){ return ''; }
}
function guardarUltimoNome(nome){
  try{
    if(nome) localStorage.setItem('calculadora-lucro-ultimo-nome', nome);
  }catch(e){}
}

function addGasto(){
  const desc = document.getElementById('g-desc').value.trim();
  const valor = parseFloat(document.getElementById('g-valor').value);
  const data = document.getElementById('g-data').value || todayStr();
  const nome = document.getElementById('g-nome').value.trim();
  if(!desc || !valor || valor<=0){ showToast('Preenche a descrição e o valor'); return; }
  if(!nome){ showToast('A assinatura (nome de quem registou) é obrigatória'); return; }
  state.gastos.push({id:Date.now(), desc, valor, data, nome});
  guardarUltimoNome(nome);
  saveState();
  showToast('Gasto guardado');
  render();
}

function addEntrada(){
  const produto = document.getElementById('e-produto').value.trim();
  const qtd = parseFloat(document.getElementById('e-qtd').value);
  const custoUnit = parseFloat(document.getElementById('e-custo').value);
  const data = document.getElementById('e-data').value || todayStr();
  const nome = document.getElementById('e-nome').value.trim();
  const carga = document.getElementById('e-carga').value.trim();
  if(!produto || !qtd || qtd<=0 || custoUnit===undefined || isNaN(custoUnit) || custoUnit<0){
    showToast('Preenche produto, quantidade e custo'); return;
  }
  if(!nome){ showToast('A assinatura (nome de quem registou) é obrigatória'); return; }
  state.entradas.push({id:Date.now(), produto, qtd, custoUnit, data, nome, carga});
  guardarUltimoNome(nome);
  saveState();
  showToast('Entrada guardada');
  render();
}

function addVenda(){
  const produto = document.getElementById('v-produto').value.trim();
  const qtd = parseFloat(document.getElementById('v-qtd').value);
  const precoUnit = parseFloat(document.getElementById('v-preco').value);
  const data = document.getElementById('v-data').value || todayStr();
  const nome = document.getElementById('v-nome').value.trim();
  if(!produto || !qtd || qtd<=0 || precoUnit===undefined || isNaN(precoUnit) || precoUnit<0){
    showToast('Preenche produto, quantidade e preço'); return;
  }
  if(!nome){ showToast('A assinatura (nome de quem registou) é obrigatória'); return; }
  const stock = computeStock();
  const disponivel = stock[produto] ? stock[produto].qty : 0;
  if(qtd > disponivel){
    showToast(`Só há ${disponivel} un de "${produto}" em stock`);
    return;
  }
  const custoMedio = custoMedioAtual(produto) || 0;
  const lucro = qtd*(precoUnit-custoMedio);
  state.vendas.push({id:Date.now(), produto, qtd, precoUnit, custoUnit:custoMedio, lucro, data, nome});
  guardarUltimoNome(nome);
  saveState();
  showToast('Venda registada');
  render();
}

function delItem(colecao, id){
  state[colecao] = state[colecao].filter(x=>x.id!==id);
  saveState();
  render();
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  if(obterPapel() === 'vendas' && btn.dataset.tab !== 'venda') return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  render();
});

loadState();
aplicarPermissoes();
if(obterPapel() === 'vendas'){ render(); }

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // se já houver uma versão à espera (ex: separador estava aberto quando actualizaste)
      if(reg.waiting){
        mostrarAvisoAtualizacao(reg);
      }
      // deteta quando uma nova versão acaba de ser descarregada
      reg.addEventListener('updatefound', ()=>{
        const novo = reg.installing;
        if(!novo) return;
        novo.addEventListener('statechange', ()=>{
          if(novo.state === 'installed' && navigator.serviceWorker.controller){
            mostrarAvisoAtualizacao(reg);
          }
        });
      });
      // verifica se há actualizações sempre que a pessoa volta a abrir a app
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible'){
          reg.update().catch(()=>{});
        }
      });
    }).catch(()=>{});

    // recarrega automaticamente assim que a nova versão assume o controlo
    let jaRecarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(jaRecarregou) return;
      jaRecarregou = true;
      window.location.reload();
    });
  });
}

function mostrarAvisoAtualizacao(reg){
  if(document.getElementById('update-bar')) return; // já está visível
  const bar = document.createElement('div');
  bar.id = 'update-bar';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--ochre);color:#1E2A38;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:0 -2px 8px rgba(0,0,0,0.2);';
  bar.innerHTML = '<span>🔄 Há uma versão nova da app disponível</span>' +
    '<button id="update-btn" style="background:#1E2A38;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;">Actualizar agora</button>';
  document.body.appendChild(bar);
  document.getElementById('update-btn').addEventListener('click', ()=>{
    const alvo = reg.waiting || reg.installing;
    if(alvo) alvo.postMessage('skipWaiting');
    bar.innerHTML = '<span>A actualizar...</span>';
  });
}
