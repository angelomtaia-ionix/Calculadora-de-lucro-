<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  .signboard p{

  nav{

    background:rgba(255,255,255,0.05);

  main{ padding:16px; max-width:640px; margin:0 auto 60px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;

  label{

  }
  input, select{
    width:100%;

    font-size:15px;

    border-radius:6px;
    background:#fff;

    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--ochre);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  button.primary{
    width:100%;
    margin-top:14px;
    padding:12px;
    background:var(--brick);

    border:none;
    border-radius:6px;

    font-size:14.5px;
    cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;

  button.primary:active{ opacity:0.85; }
  button.secondary{
    background:none;
    border:1.5px solid var(--line);
    color:var(--ink);
    padding:8px 12px;

    cursor:pointer;

  .preview{
    margin-top:10px;
    padding:10px 12px;
    background:#FFF9EA;
    border:1px dashed var(--ochre);
    border-radius:6px;

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left;

  .lucro-neg{ color:var(--danger); font-weight:700; }
  .empty{ text-align:center; color:var(--zinc-3); padding:24px 8px; font-size:13px;}

    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;

</style>

<body>

<div class="signboard">
  <h1>Calculadora de Lucro</h1>
  <p>Telefones &amp; acessórios</p>
</div>

<div id="sync-bar" style="background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
  <span id="sync-status">🔴 Não sincronizado — só neste telemóvel</span>
  <button id="sync-btn" onclick="signIn()" style="background:var(--teal);color:#fff;border:none;border-radius:5px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;">Entrar com Google</button>
</div>
<div style="background:#FFF9EA;padding:6px 16px;font-size:11px;color:#8A6A12;text-align:center;">
  🔒 Cada conta Google vê só os seus próprios dados — nada é partilhado com outros utilizadores.
</div>

<nav id="tabs">
  <button data-tab="resumo" class="active">Resumo</button>
  <button data-tab="gasto">Gastos&nbsp;iniciais</button>
  <button data-tab="entrada">Entrada</button>
  <button data-tab="venda">Venda</button>
  <button data-tab="stock">Stock</button>
  <button data-tab="ajuda">Ajuda</button>
</nav>

<main id="app">Carregando…</main>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function(e){
  var app = document.getElementById('app');
  if(app){
    app.innerHTML = '<div class="card"><h2 style="color:#B4432D">Ocorreu um erro</h2>' +
      '<p style="font-size:13px">' + (e.message || 'Erro desconhecido') + '</p>' +
      '<p style="font-size:12px;color:#8B9096">Tira um print deste ecrã e envia para ajuda a corrigir.</p></div>';
  }
});
const STORE_KEY = 'ribaue-banca-v1';
let state = { gastos: [], entradas: [], vendas: [], updatedAt: 0 };
let currentTab = 'resumo';
let loaded = false;

// ---- Sincronização com Google Drive ----
const GOOGLE_CLIENT_ID = '519082885918-iblstrjm2cqrur3j2ac38vqo2svgdb3m.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'calculadora-lucro-dados.json';
let tokenClient = null;
let accessToken = null;
let driveFileId = null;
let userEmail = null;
let syncTimer = null;

let googleInitTentativas = 0;
function initGoogleAuth(){
  const status = document.getElementById('sync-status');
  if(typeof google === 'undefined' || !google.accounts){
    googleInitTentativas++;
    if(status) status.textContent = '⚪ A preparar login do Google...';
    if(googleInitTentativas > 20){
      if(status) status.textContent = '🔴 Não foi possível carregar o sistema de login do Google (verifica a internet e recarrega a página)';
      return;
    }
    setTimeout(initGoogleAuth, 500);
    return;
  }
  try{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: onTokenResponse
    });
    if(status) status.textContent = '🔴 Não sincronizado — só neste telemóvel';
  }catch(e){
    if(status) status.textContent = '🔴 Erro a preparar login: ' + e.message;
  }
}

function signIn(){
  const status = document.getElementById('sync-status');
  if(!tokenClient){
    if(status) status.textContent = '🟡 Sistema de login ainda não está pronto, aguarda...';
    return;
  }
  if(status) status.textContent = '🟡 A abrir login do Google...';
  tokenClient.requestAccessToken();
}

function signOut(){
  if(accessToken){
    google.accounts.oauth2.revoke(accessToken, ()=>{});
  }
  accessToken = null;
  driveFileId = null;
  userEmail = null;
  if(syncTimer){ clearInterval(syncTimer); syncTimer = null; }
  atualizarBarraSync();
  showToast('Sessão terminada');
}

function onTokenResponse(response){
  if(response.error){
    document.getElementById('sync-status').textContent = '🔴 Erro no login: ' + response.error;
    return;
  }
  accessToken = response.access_token;
  document.getElementById('sync-status').textContent = '🟡 A ligar ao Drive...';
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + accessToken }
  }).then(r=>r.json()).then(info=>{
    userEmail = info.email || 'conta Google';
    ensureDriveFile();
  }).catch(()=>{
    ensureDriveFile();
  });
}

function ensureDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + accessToken }
  })
  .then(r=>{
    if(!r.ok){
      return r.json().then(err=>{ throw new Error('Drive list ' + r.status + ': ' + JSON.stringify(err.error && err.error.message || err)); });
    }
    return r.json();
  })
  .then(data=>{
    if(data.files && data.files.length > 0){
      driveFileId = data.files[0].id;
      pullFromDrive(true);
    } else {
      criarFicheiroDrive();
    }
  })
  .catch((e)=>{
    document.getElementById('sync-status').textContent = '🔴 Erro Drive: ' + (e.message || e);
  });
}

function criarFicheiroDrive(){
  const metadata = { name: DRIVE_FILENAME, mimeType: 'application/json' };
  const boundary = '-------calc-lucro-boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(state)}\r\n` +
    `--${boundary}--`;
  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body: body
  })
  .then(r=>{
    if(!r.ok){
      return r.json().then(err=>{ throw new Error('Criar ficheiro ' + r.status + ': ' + JSON.stringify(err.error && err.error.message || err)); });
    }
    return r.json();
  })
  .then(data=>{
    driveFileId = data.id;
    iniciarSincronizacaoPeriodica();
    atualizarBarraSync();
    showToast('Ligado ao Google Drive');
  })
  .catch((e)=>{
    document.getElementById('sync-status').textContent = '🔴 Erro Drive: ' + (e.message || e);
  });
}

function pullFromDrive(silencioso){
  if(!accessToken || !driveFileId) return;
  fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + accessToken }
  })
  .then(r=>r.json())
  .then(remoto=>{
    if(remoto && typeof remoto.updatedAt === 'number' && remoto.updatedAt > (state.updatedAt||0)){
      state = remoto;
      try{ localStorage.setItem('calculadora-lucro-estado', JSON.stringify(state)); }catch(e){}
      render();
      if(!silencioso) showToast('Dados actualizados a partir do Drive');
    }
    iniciarSincronizacaoPeriodica();
    atualizarBarraSync();
  })
  .catch(()=>{
    iniciarSincronizacaoPeriodica();
    atualizarBarraSync();
  });
}

function pushToDrive(){
  if(!accessToken || !driveFileId) return;
  fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
    method: 'PATCH',
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(state)
  }).catch(()=>{ showToast('Não foi possível sincronizar agora'); });
}

function iniciarSincronizacaoPeriodica(){
  if(syncTimer) return;
  syncTimer = setInterval(()=>pullFromDrive(true), 15000);
}

function atualizarBarraSync(){
  const status = document.getElementById('sync-status');
  const btn = document.getElementById('sync-btn');
  if(!status || !btn) return;
  if(accessToken && driveFileId){
    status.textContent = `🟢 Sincronizado${userEmail ? ' — ' + userEmail : ''}`;
    btn.textContent = 'Sair';
    btn.onclick = signOut;
  } else {
    status.textContent = '🔴 Não sincronizado — só neste telemóvel';
    btn.textContent = 'Entrar com Google';
    btn.onclick = signIn;
  }
}

function esc(texto){
  if(texto === null || texto === undefined) return '';
  return String(texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtMT(n){
  return (Math.round(n*100)/100).toLocaleString('pt-PT') + ' MT';
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(s){
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function loadState(){
  try{
    let raw = localStorage.getItem('calculadora-lucro-estado');
    if(!raw){
      // migração: procura dados guardados com o nome antigo da app
      const antigo = localStorage.getItem('mtaia-estado');
      if(antigo){
        raw = antigo;
        localStorage.setItem('calculadora-lucro-estado', antigo);
      }
    }
    if(raw){
      state = JSON.parse(raw);
      if(typeof state.updatedAt !== 'number') state.updatedAt = 0;
    }
  }catch(e){
    // no data yet
  }
  loaded = true;
  render();
  initGoogleAuth();
}

function saveState(){
  state.updatedAt = Date.now();
  try{
    localStorage.setItem('calculadora-lucro-estado', JSON.stringify(state));
  }catch(e){
    showToast('Erro ao guardar — tenta novamente');
  }
  if(accessToken && driveFileId){
    pushToDrive();
  }
}

function exportarDados(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calculadora-lucro-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Ficheiro de backup transferido');
}

function importarDados(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const novo = JSON.parse(e.target.result);
      if(!novo.gastos || !novo.entradas || !novo.vendas) throw new Error('formato inválido');
      state = novo;
      saveState();
      showToast('Dados importados com sucesso');
      render();
    }catch(err){
      showToast('Ficheiro inválido — não foi possível importar');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ---- Stock derivation from entradas + vendas ----
function computeStock(){
  const stock = {}; // nome -> {qty, custoMedio, totalInvestido}
  state.entradas.forEach(e=>{
    if(!stock[e.produto]) stock[e.produto] = {qty:0, valor:0};
    stock[e.produto].qty += e.qtd;
    stock[e.produto].valor += e.qtd * e.custoUnit;
  });
  state.vendas.forEach(v=>{
    if(!stock[v.produto]) stock[v.produto] = {qty:0, valor:0};
    const custoMedioAntes = stock[v.produto].qty > 0 ? (stock[v.produto].valor/stock[v.produto].qty) : v.custoUnit;
    stock[v.produto].qty -= v.qtd;
    stock[v.produto].valor -= v.qtd * custoMedioAntes;
  });
  return stock;
}

function custoMedioAtual(produto){
  const stock = computeStock();
  const s = stock[produto];
  if(!s || s.qty <= 0) return null;
  return s.valor / s.qty;
}

// ---- Totals ----
function totals(){
  const totalGastos = state.gastos.reduce((a,g)=>a+g.valor,0);
  const totalEntradas = state.entradas.reduce((a,e)=>a+e.qtd*e.custoUnit,0);
  const totalVendas = state.vendas.reduce((a,v)=>a+v.qtd*v.precoUnit,0);
  const totalLucro = state.vendas.reduce((a,v)=>a+v.lucro,0);
  const investidoTotal = totalGastos + totalEntradas;
  return {totalGastos, totalEntradas, totalVendas, totalLucro, investidoTotal};
}

function produtosMaisVendidos(){
  const agrupado = {};
  state.vendas.forEach(v=>{
    if(!agrupado[v.produto]) agrupado[v.produto] = {qtd:0, receita:0, lucro:0};
    agrupado[v.produto].qtd += v.qtd;
    agrupado[v.produto].receita += v.qtd * v.precoUnit;
    agrupado[v.produto].lucro += v.lucro;
  });
  return Object.entries(agrupado)
    .map(([produto, dados])=>({produto, ...dados}))
    .sort((a,b)=> b.qtd - a.qtd);
}

// ---- Render ----
function render(){
  if(!loaded) return;
  const app = document.getElementById('app');
  if(currentTab==='resumo') app.innerHTML = renderResumo();
  else if(currentTab==='gasto') app.innerHTML = renderGasto();
  else if(currentTab==='entrada') app.innerHTML = renderEntrada();
  else if(currentTab==='venda') app.innerHTML = renderVenda();
  else if(currentTab==='stock') app.innerHTML = renderStock();
  else if(currentTab==='ajuda') app.innerHTML = renderAjuda();
  attachHandlers();
}

function renderResumo(){
  const t = totals();
  const recentes = [
    ...state.gastos.map(g=>({...g, tipo:'gasto', data:g.data})),
    ...state.entradas.map(e=>({...e, tipo:'entrada', data:e.data})),
    ...state.vendas.map(v=>({...v, tipo:'venda', data:v.data})),
  ].sort((a,b)=> b.data.localeCompare(a.data) || (b.id-a.id)).slice(0,8);

  return `
  <div class="stat-grid">
    <div class="stat gasto"><div class="label">Investido no total</div><div class="value">${fmtMT(t.investidoTotal)}</div></div>
    <div class="stat vendas"><div class="label">Total vendido</div><div class="value">${fmtMT(t.totalVendas)}</div></div>
    <div class="stat lucro"><div class="label">Lucro acumulado</div><div class="value">${fmtMT(t.totalLucro)}</div></div>
    <div class="stat"><div class="label">Gastos iniciais</div><div class="value">${fmtMT(t.totalGastos)}</div></div>
  </div>

  <div class="card">
    <h2>Últimos movimentos</h2>
    ${recentes.length===0 ? '<div class="empty">Ainda não há registos. Começa por lançar os gastos iniciais.</div>' :
    `<table><tbody>
      ${recentes.map(r=>{
        if(r.tipo==='gasto') return `<tr><td><span class="tag gasto">Gasto</span><br><span style="font-size:12px">${esc(r.desc)}</span><br><span style="font-size:10.5px;color:var(--zinc-3)">✍ ${esc(r.nome)||'—'}</span></td><td style="text-align:right">${fmtDate(r.data)}<br>${fmtMT(r.valor)}</td></tr>`;
        if(r.tipo==='entrada') return `<tr><td><span class="tag entrada">Entrada</span><br><span style="font-size:12px">${esc(r.produto)} ×${r.qtd}</span><br><span style="font-size:10.5px;color:var(--zinc-3)">✍ ${esc(r.nome)||'—'}</span></td><td style="text-align:right">${fmtDate(r.data)}<br>${fmtMT(r.qtd*r.custoUnit)}</td></tr>`;
        return `<tr><td><span class="tag venda">Venda</span><br><span style="font-size:12px">${esc(r.produto)} ×${r.qtd}</span><br><span style="font-size:10.5px;color:var(--zinc-3)">✍ ${esc(r.nome)||'—'}</span></td><td style="text-align:right">${fmtDate(r.data)}<br><span class="${r.lucro>=0?'lucro-pos':'lucro-neg'}">${r.lucro>=0?'+':''}${fmtMT(r.lucro)}</span></td></tr>`;
      }).join('')}
    </tbody></table>`}
  </div>
  <div class="card">
    <h2>Produtos mais vendidos</h2>
    ${(()=>{
      const top = produtosMaisVendidos();
      if(top.length===0) return '<div class="empty">Ainda não há vendas registadas.</div>';
      return `<table><thead><tr><th>Produto</th><th style="text-align:right">Qtd</th><th style="text-align:right">Receita</th><th style="text-align:right">Lucro</th></tr></thead><tbody>
        ${top.slice(0,10).map((p,i)=>`
          <tr><td>${i===0?'🏆 ':''}${esc(p.produto)}</td>
          <td style="text-align:right">${p.qtd}</td>
          <td style="text-align:right">${fmtMT(p.receita)}</td>
          <td style="text-align:right" class="${p.lucro>=0?'lucro-pos':'lucro-neg'}">${p.lucro>=0?'+':''}${fmtMT(p.lucro)}</td></tr>
        `).join('')}
      </tbody></table>`;
    })()}
  </div>
  <div class="card">
    <h2>Cópia de segurança</h2>
    <p style="font-size:12.5px;color:var(--zinc-3);margin:0 0 10px;">Guarda um ficheiro de backup, ou transfere os dados para outro telemóvel.</p>
    <button class="secondary" style="width:100%;margin-bottom:8px;" onclick="exportarDados()">⬇ Exportar dados (backup)</button>
    <label style="margin-top:0;">Importar backup</label>
    <input type="file" accept="application/json" onchange="importarDados(this)">
  </div>
  <p class="foot-note">Os dados ficam guardados apenas neste telemóvel/navegador. Usa "Exportar" regularmente para não perderes o histórico.</p>
  `;
}

function renderStock(){
  const stock = computeStock();
  const nomes = Object.keys(stock).sort();
  return `
  <div class="card">
    <h2>Stock actual</h2>
    ${nomes.length===0 ? '<div class="empty">Regista uma entrada de stock para começares a ver aqui.</div>' :
    nomes.map(n=>{
      const s = stock[n];
      const custoMedio = s.qty>0 ? s.valor/s.qty : 0;
      return `<div class="stock-row">
        <div>
          <div class="stock-name">${esc(n)}</div>
          <div class="stock-qty">custo médio ${fmtMT(custoMedio)}/un</div>
        </div>
        <div style="text-align:right">
          <div class="${s.qty<=2?'low':''}" style="font-weight:700">${s.qty} un</div>
          <div class="stock-qty">${fmtMT(Math.max(s.valor,0))}</div>
        </div>
      </div>`;
    }).join('')
    }
  </div>
  <p class="foot-note">O stock é calculado automaticamente a partir das entradas menos as vendas registadas. Quantidades em vermelho estão a acabar.</p>
  `;
}

// ---- Handlers ----
function attachHandlers(){
  const eProduto = document.getElementById('e-produto');
  const eQtd = document.getElementById('e-qtd');
  const eCusto = document.getElementById('e-custo');
  if(eQtd && eCusto){
    [eQtd, eCusto].forEach(el=>el.addEventListener('input', updateEntradaPreview));
  }
  const vProduto = document.getElementById('v-produto');
  const vQtd = document.getElementById('v-qtd');
  const vPreco = document.getElementById('v-preco');
  if(vProduto && vQtd && vPreco){
    [vProduto, vQtd, vPreco].forEach(el=>el.addEventListener('input', updateVendaPreview));
  }
}

function updateEntradaPreview(){
  const qtd = parseFloat(document.getElementById('e-qtd').value)||0;
  const custo = parseFloat(document.getElementById('e-custo').value)||0;
  document.getElementById('e-preview').innerHTML = `Custo total desta entrada: <b>${fmtMT(qtd*custo)}</b>`;
}

function updateVendaPreview(){
  const produto = document.getElementById('v-produto').value.trim();
  const qtd = parseFloat(document.getElementById('v-qtd').value)||0;
  const preco = parseFloat(document.getElementById('v-preco').value)||0;
  const el = document.getElementById('v-preview');
  if(!produto || qtd<=0){
    el.innerHTML = 'Escolhe o produto e a quantidade para ver o lucro calculado automaticamente.';
    return;
  }
  const custoMedio = custoMedioAtual(produto);
  if(custoMedio===null){
    el.innerHTML = `<b>Aviso:</b> não há stock registado para "${esc(produto)}". O lucro vai assumir custo 0 — regista primeiro a entrada deste produto para um cálculo correcto.`;
    return;
  }
  const lucro = qtd*(preco-custoMedio);
  el.innerHTML = `Custo médio: <b>${fmtMT(custoMedio)}</b>/un &nbsp;→&nbsp; Lucro desta venda: <b class="${lucro>=0?'lucro-pos':'lucro-neg'}">${lucro>=0?'+':''}${fmtMT(lucro)}</b>`;
}

function ultimoNome(){
  try{
    return localStorage.getItem('calculadora-lucro-ultimo-nome') || '';
  }catch(e){ return ''; }
}
function guardarUltimoNome(nome){
  try{
    if(nome) localStorage.setItem('calculadora-lucro-ultimo-nome', nome);
  }catch(e){}
}

function addGasto(){
  const desc = document.getElementById('g-desc').value.trim();
  const valor = parseFloat(document.getElementById('g-valor').value);
  const data = document.getElementById('g-data').value || todayStr();
  const nome = document.getElementById('g-nome').value.trim();
  if(!desc || !valor || valor<=0){ showToast('Preenche a descrição e o valor'); return; }
  if(!nome){ showToast('A assinatura (nome de quem registou) é obrigatória'); return; }
  state.gastos.push({id:Date.now(), desc, valor, data, nome});
  guardarUltimoNome(nome);
  saveState();
  showToast('Gasto guardado');
  render();
}

function addEntrada(){
  const produto = document.getElementById('e-produto').value.trim();
  const qtd = parseFloat(document.getElementById('e-qtd').value);
  const custoUnit = parseFloat(document.getElementById('e-custo').value);
  const data = document.getElementById('e-data').value || todayStr();
  const nome = document.getElementById('e-nome').value.trim();
  if(!produto || !qtd || qtd<=0 || custoUnit===undefined || isNaN(custoUnit) || custoUnit<0){
    showToast('Preenche produto, quantidade e custo'); return;
  }
  if(!nome){ showToast('A assinatura (nome de quem registou) é obrigatória'); return; }
  state.entradas.push({id:Date.now(), produto, qtd, custoUnit, data, nome});
  guardarUltimoNome(nome);
  saveState();
  showToast('Entrada guardada');
  render();
}

function addVenda(){
  const produto = document.getElementById('v-produto').value.trim();
  const qtd = parseFloat(document.getElementById('v-qtd').value);
  const precoUnit = parseFloat(document.getElementById('v-preco').value);
  const data = document.getElementById('v-data').value || todayStr();
  const nome = document.getElementById('v-nome').value.trim();
  if(!produto || !qtd || qtd<=0 || precoUnit===undefined || isNaN(precoUnit) || precoUnit<0){
    showToast('Preenche produto, quantidade e preço'); return;
  }
  if(!nome){ showToast('A assinatura (nome de quem registou) é obrigatória'); return; }
  const stock = computeStock();
  const disponivel = stock[produto] ? stock[produto].qty : 0;
  if(qtd > disponivel){
    showToast(`Só há ${disponivel} un de "${produto}" em stock`);
    return;
  }
  const custoMedio = custoMedioAtual(produto) || 0;
  const lucro = qtd*(precoUnit-custoMedio);
  state.vendas.push({id:Date.now(), produto, qtd, precoUnit, custoUnit:custoMedio, lucro, data, nome});
  guardarUltimoNome(nome);
  saveState();
  showToast('Venda registada');
  render();
}

function delItem(colecao, id){
  state[colecao] = state[colecao].filter(x=>x.id!==id);
  saveState();
  render();
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  render();
});

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
